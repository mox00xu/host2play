name: Host2Play Auto Renew

on:
  schedule:
    # 每天 UTC 时间 0:00, 11:00, 22:00 运行（北京时间 8:00, 19:00, 次日 6:00）
    - cron: '0 0,11,22 * * *'
    # 额外触发点
    - cron: '30 5,16 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Bun 环境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Playwright 浏览器
        run: |
          bun install
          bunx playwright install chromium
          bunx playwright install-deps chromium

      - name: 执行续期脚本
        env:
          HOST2PLAY_EMAIL: ${{ secrets.HOST2PLAY_EMAIL }}
          HOST2PLAY_PASSWORD: ${{ secrets.HOST2PLAY_PASSWORD }}
        run: bun run renew.ts

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: /tmp/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
