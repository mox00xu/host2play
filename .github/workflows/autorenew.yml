name: Host2Play Autorenew

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright
        run: |
          bun add playwright
          bunx playwright install chromium --with-deps

      - name: Run renew script
        env:
          HOST2PLAY_EMAIL: ${{ secrets.HOST2PLAY_EMAIL }}
          HOST2PLAY_PASSWORD: ${{ secrets.HOST2PLAY_PASSWORD }}
        run: bun run renew.ts
